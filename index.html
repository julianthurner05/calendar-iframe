<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Announcement Calendar – sounddna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/embed.css">
  <link rel="stylesheet" href="css/calendar.css">
</head>
<body>

  <!-- ============ ICON-SPRITE (lucide) – nur die Symbole, die der Kalender braucht ============ -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></symbol>
  </svg>

  <main class="embed-main">

    <!-- Calendar – identisches Gerüst wie im SpotTool, ohne Edit-Funktionen -->
    <section class="calendar-view" data-screen="calendar">
      <div class="cal-head">
        <h1 class="cal-head__title" id="cal-store">Announcement Calendar</h1>
        <div class="cal-week">
          <button class="cal-week__nav" id="cal-prev" aria-label="Previous week" data-tip="Previous week">
            <svg class="icon"><use href="#i-chevron-left"/></svg>
          </button>
          <span class="cal-week__label" id="cal-range"></span>
          <button class="cal-week__nav" id="cal-next" aria-label="Next week" data-tip="Next week">
            <svg class="icon"><use href="#i-chevron-right"/></svg>
          </button>
        </div>
        <button class="cal-today" id="cal-today">Today</button>
        <div class="cal-legend" id="cal-legend"></div>
        <span class="cal-hint">Every slot represents 30 minutes.</span>
        <label class="cal-toggle">
          <span>Show titles</span>
          <button class="switch" id="cal-titles" role="switch" aria-checked="false"><span class="switch__knob"></span></button>
        </label>
      </div>
      <div class="cal-days" id="cal-days"></div>
      <div class="cal-grid" id="cal-grid"></div>
      <p class="cal-empty" id="cal-empty" hidden></p>
    </section>

  </main>

  <script src="js/embed.js"></script>
</body>
</html>
